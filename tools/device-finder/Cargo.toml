[package]
name = "device-finder"
version = "0.1.0"
edition = "2021"
description = "Cross-platform device discovery CLI/TUI for developers"
authors = ["ItamiForge"]
license = "MIT"

[[bin]]
name = "device-finder"
path = "src/main.rs"

[lib]
name = "device_finder"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4.1"
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.32"
directories = "5.0"
colored = "2"
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
