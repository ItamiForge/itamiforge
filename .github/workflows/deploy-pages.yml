name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: |
          echo "::group::Oxlint"
          bun run lint
          echo "::endgroup::"

      - name: Check formatting
        run: |
          echo "::group::Oxfmt Check"
          bun run format:check
          echo "::endgroup::"

      - name: Type check
        run: |
          echo "::group::TypeScript"
          bun run typecheck
          echo "::endgroup::"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Socket Security Audit
        run: |
          echo "::group::Socket Security Scan"
          bun run security:audit
          echo "::endgroup::"

  build:
    name: Build & Prepare
    needs: [lint, security]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          echo "::group::Bun Install"
          bun install --frozen-lockfile
          echo "::endgroup::"

      - name: Build static site
        env:
          NEXT_PUBLIC_ANALYTICS_ENDPOINT: ${{ vars.NEXT_PUBLIC_ANALYTICS_ENDPOINT }}
          NEXT_PUBLIC_SITESTATS_URL: ${{ vars.NEXT_PUBLIC_SITESTATS_URL }}
          NEXT_PUBLIC_SITESTATS_KEY: ${{ secrets.NEXT_PUBLIC_SITESTATS_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "::group::Next.js Build"
          bun run build:pages
          echo "::endgroup::"

      - name: Post-build cleanup
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deployment
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
