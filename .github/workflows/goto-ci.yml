name: Goto CI

on:
  push:
    branches: [main]
    paths:
      - 'tools/goto/**'
      - '.github/workflows/goto-ci.yml'
  pull_request:
    paths:
      - 'tools/goto/**'
      - '.github/workflows/goto-ci.yml'

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/goto

      - name: Lint check
        working-directory: tools/goto
        run: |
          echo "::group::Cargo Fmt"
          cargo fmt -- --check
          echo "::endgroup::"

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/goto

      - name: Run tests
        working-directory: tools/goto
        run: |
          echo "::group::Running Tests"
          cargo test --release
          echo "::endgroup::"

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/goto

      - name: Build release artifact
        working-directory: tools/goto
        run: |
          echo "::group::Cargo Build"
          cargo build --release
          echo "::endgroup::"
